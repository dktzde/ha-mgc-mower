# Checks the integration with hassfest, the validator Home Assistant uses for
# its own integrations. Runs on every push to main, on pull requests and once
# a day, so a change in Home Assistant that breaks the integration shows up
# early (and in the README badge).
name: Hassfest

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
